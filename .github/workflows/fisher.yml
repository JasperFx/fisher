name: fisher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# fisher#314. Without this, every push to a pull request branch queued a NEW set of three jobs while
# the previous set was still waiting, and nothing cancelled the superseded one — it held a slot until
# it finished testing content nobody would look at.
#
# That is not a Fisher-only cost. JasperFx is on the Free org plan, so the concurrent-job ceiling is
# shared across every repo in the org: during the #306/#308/#309 wave the org queue reached 230 jobs
# queued against 9 running, and a wasted Fisher run is a slot marten, wolverine or weasel does not get.
#
# `cancel-in-progress` is CONDITIONAL rather than simply true, and that is the part worth reading
# twice. On a pull request the older run really is superseded. On a push to `main` it is not — each
# commit's CI result is the record for that commit, and a release is cut from one, so cancelling an
# in-flight `main` run destroys the only evidence that the commit was green.
#
# `head_ref || ref` groups a pull request by its source branch rather than by the synthetic
# `refs/pull/N/merge`; identical in effect here, and it reads correctly in the Actions UI.
#
# `publish.yml` is deliberately left without one: it fires on a tag, each tag publishes once, and a
# cancelled publish is worse than a duplicated queue slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Explicit because the ledger download below reads another run's artifacts (actions: read), and
    # declaring any permission drops the rest: checks: write is what dorny/test-reporter needs.
    permissions:
      actions: read
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Fisher multi-targets, and the two frameworks are exercised as separate jobs rather than
        # via a single `dotnet test`. Directory.Build.props sets TestTfmsInParallel=false because the
        # suites share database files; naming one framework per job sidesteps that entirely.
        tfm: [ net9.0, net10.0 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Both runtimes: the 10.0 SDK builds either target framework, but running the net9.0 test
      # executable needs the .NET 9 runtime present as well.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # The lane balancer's known durations travel as a CI artifact, never a commit (bobcat#730): the
      # newest successful main run's ledger for this framework, folded forward by the build and
      # uploaded again below. Keyed by display name since Bobcat 1.0, so a ledger written on another
      # machine, configuration or runner still matches. None yet (or an expired artifact) is fine:
      # lanes balance by test count and the run says "Known durations matched 0/N".
      - name: Download the previous test ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow fisher.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "${{ github.repository }}" --name "test-ledger-${{ matrix.tfm }}" \
              --dir artifacts/test-ledger || echo "No test-ledger-${{ matrix.tfm }} artifact on run $run_id"
          fi
          ls -la artifacts/test-ledger 2>/dev/null || echo "No ledger: lanes balance by test count"

      # Build and test through the Nuke build (build/, JasperFx/bobcat#565): `CI` compiles the whole
      # solution and runs the three suites -- Fisher.Tests, Fisher.AspNetCore.Tests,
      # Fisher.EntityFrameworkCore.Tests, in that order -- through Bobcat's Supervisor. What the job
      # does is defined there, not here; build/SupervisedTests.cs says why each setting is what it is.
      #
      #   - Built without -f: Fisher.Benchmarks is deliberately net10.0-only, and a solution-wide
      #     `-f net9.0` fails on it with NETSDK1005. The suites then run for this leg's framework only.
      #   - Each suite's MTP executable is driven as worker processes, partitioned by test class, each
      #     worker with a temp directory of its own (.nuke/temp/lanes/<suite>-<tfm>/lane-N), so every
      #     lane's SQLite files are its own. Fisher.Tests asks for 2 workers; the build clamps any count
      #     to ProcessorCount/2, which is 2 on a 4-vCPU hosted runner.
      #   - Retries are opt-in only, and no Fisher test opts in: one attempt per test, exactly the
      #     ceiling the direct executable invocation had.
      #   - A failure in the first suite still lets the others run; the target fails at the end.
      #   - Each suite's TRX is written by the build to <project>/bin/Release/<tfm>/TestResults/, where
      #     the scoreboard check and the reporter below already look. (`dotnet test` still cannot be
      #     used for this: under MTP it writes no TRX -- see CLAUDE.md's Conventions.)
      #   - The supervisor's run report goes to this job's summary.
      #
      # No database service. Fisher is SQLite-backed and the suites create throwaway database files
      # under their temp directory, so there is nothing to spin up or wait for.
      - name: Build and test (supervised)
        run: ./build.sh CI --framework ${{ matrix.tfm }}

      # HANDOFF.md calls itself the compliance scoreboard, and its numbers are hand-maintained --
      # which is why they rot. fisher#107 found it claiming "2.49.0 ships 32 suites, 275 tests"
      # while its own header already said 2.51.0: two scoreboards in one file disagreeing, both
      # understating Fisher in the document the 1.0 README points at as the public account of what
      # Fisher does not do. This compares every number in it against the TRX reports just written.
      #
      # No `if:`, so it inherits the default of running only when the steps before it succeeded.
      # That is what we want: a red suite makes the counts unverifiable rather than wrong, and a
      # failed run should not also produce a confusing second failure about arithmetic. The script
      # refuses to report agreement on a run with failures for the same reason, in case it is ever
      # invoked directly.
      - name: The scoreboard agrees with the run
        run: python3 scripts/check_scoreboard.py --tfm ${{ matrix.tfm }} --configuration Release

      # fisher#223. A literal NUL in DocumentMapping.cs made git treat one of the most-edited files
      # in the repository as binary: no diffs, no automatic merge, and grep skipping it silently.
      # The cost recurred on every change to that file, so this is what stops it coming back.
      #
      # Runs even on a red suite, unlike the step above: that one reads the run's results, so a
      # failure makes its answer unverifiable rather than wrong. This one reads only the source
      # tree, and a NUL byte is worth reporting either way.
      - name: Source files are text, not binary
        if: ${{ !cancelled() }}
        run: python3 scripts/check_source_is_text.py

      # fisher#189. Every test database is a real file in the temp directory, and one surviving the
      # run means something outlived the test that owned it -- the way it happened was an async
      # daemon disposed without being stopped, whose next poll re-created the file the fixture had
      # just deleted. A daemon still polling after its test finished is doing unpredictable work
      # while other tests run, so the leaked file is the cheap visible symptom of a hazard that is
      # otherwise invisible until a loaded host turns it into a failure.
      #
      # No `if:`, so it inherits "only when the steps before it succeeded", like the scoreboard check
      # and unlike the NUL-byte one: a failing test may legitimately skip its own cleanup, so a leak
      # reported over a red suite points at the wrong thing.
      #
      # Under the supervisor each worker's temp directory is its lane's, so the lanes are what is
      # checked -- plus the system temp directory, for anything that bypassed TMPDIR.
      - name: The suites left no databases behind
        run: |
          args=(--temp-dir "$(python3 -c 'import tempfile; print(tempfile.gettempdir())')")
          for lane in .nuke/temp/lanes/*-${{ matrix.tfm }}/lane-*; do args+=(--temp-dir "$lane"); done
          python3 scripts/check_no_leaked_databases.py "${args[@]}"

      - name: Report results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          # Distinct per matrix leg — a shared name makes the second job overwrite the first's check.
          name: xUnit Tests (${{ matrix.tfm }})
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
          list-suites: "failed"
          list-tests: "failed"

      # The ledger downloaded above with this run folded in (newest 5 runs per test). A red run's
      # durations are still durations, so it uploads whatever the outcome; the next run downloads
      # only from a successful main run, so a PR's ledger is never the one carried forward.
      - name: Upload the test ledger
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-ledger-${{ matrix.tfm }}
          path: artifacts/test-ledger/*.${{ matrix.tfm }}.json
          if-no-files-found: warn
          retention-days: 30

  # fisher#73. The one property of the published package that nothing else can see: a consumer
  # referencing only the Fisher package needs the projection-dispatcher generator, and its absence
  # is silent — the consumer's assembly compiles clean (the generator's absence removes generated
  # partials nothing hand-written references) and then throws "No source-generated dispatcher
  # found ..." on its first projected event. No test can catch that from inside this repository,
  # because the test projects reference the generator directly. So it is asserted against the
  # packed nupkg here.
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack src/Fisher/Fisher.csproj -c Release -o ./artifacts

      - name: The package carries the projection dispatcher generator
        run: |
          nupkg=$(ls ./artifacts/Fisher.*.nupkg)
          echo "Inspecting $nupkg"
          unzip -l "$nupkg" | grep -q 'analyzers/dotnet/cs/JasperFx.Events.SourceGenerator.dll' || {
            echo "::error::$nupkg does not bundle JasperFx.Events.SourceGenerator. A consumer's"
            echo "::error::projections would compile clean and throw on their first event."
            unzip -l "$nupkg"
            exit 1
          }

      - name: The generator is bundled, not leaked as a transitive dependency
        run: |
          nupkg=$(ls ./artifacts/Fisher.*.nupkg)
          if unzip -p "$nupkg" Fisher.nuspec | grep -qi 'JasperFx.Events.SourceGenerator'; then
            echo "::error::Fisher.nuspec declares JasperFx.Events.SourceGenerator as a dependency."
            echo "::error::It must stay PrivateAssets=all — flowing downstream double-loads the"
            echo "::error::generator in a project referencing two Critter Stack stores (CS0111)."
            exit 1
          fi

      # fisher#337. The two assertions above read the nupkg's contents; this CONSUMES it. The
      # smoke project references only the packed Fisher — the one shape no test project here has,
      # since they all reference the generator directly — with JasperFxEventsRequireSourceGenerator
      # on, so a generator that stopped flowing out of the package fails the build (JFXEVT900),
      # and then runs a conventional aggregate to prove the attached generator dispatches.
      #
      # A prerelease version nothing on nuget.org carries, restored into a private package folder,
      # with source mapping pinning Fisher to the local feed: otherwise this could quietly pass
      # against the last published release instead of this commit.
      - name: A consumer of the packed Fisher gets a working projection dispatcher
        run: |
          dotnet pack src/Fisher/Fisher.csproj -c Release -o ./artifacts/smoke -p:Version=0.0.0-smoke
          dotnet run --project smoke/packaged-consumer -c Release -p:FisherVersion=0.0.0-smoke

      # fisher#384. A document write in a Native AOT image. Nothing else here can see an AOT failure:
      # every test runs under CoreCLR, where reflective generic closing works, and ILC reports only an
      # assembly-level IL2104/IL3053 rollup that names nothing. So the smoke is published natively and
      # RUN. Native AOT on Linux needs clang and zlib; the grep makes sure the publish really
      # compiled native code rather than quietly producing a JIT build.
      - name: A document write works in a Native AOT image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev > /dev/null
          dotnet publish smoke/aot-consumer -c Release --use-current-runtime -o ./artifacts/aot \
            | tee aot-publish.log
          grep -q "Generating native code" aot-publish.log || {
            echo "::error::The AOT smoke did not compile native code, so it proves nothing."
            exit 1
          }
          ./artifacts/aot/AotConsumer
