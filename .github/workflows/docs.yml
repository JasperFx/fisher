name: Deploy docs

# A release publishes the packages and the site it points at, together. `publish.yml` fires on the
# same tag, so `gh release create v1.0.0` is the whole release: three nupkgs and the documentation
# that documents them, cut from one commit. Without this the site drifted — it was
# workflow_dispatch-only and had never run, so fisher.jasperfx.net was two waves behind the packages
# while `PackageProjectUrl` on every one of them pointed at it.
#
# Lowercase `v*` matches the pattern `publish.yml` uses, and matters for the same reason: a tag cut
# as `V1.0.0` matches neither workflow and the release silently does nothing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  node_version: 24.x

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # mdsnippets is a .NET global tool, and `npm run docs-build` invokes it alongside the
      # VitePress build to fill every `<!-- snippet: … -->` block from the compiled source.
      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install mdsnippets
        run: dotnet tool install -g MarkdownSnippets.Tool

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VitePress fails the build on a dead internal link, so this step is the docs' test suite.
      - name: Build docs
        run: npm run docs-build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy docs/.vitepress/dist --project-name=jasperfx-fisher --branch=main
